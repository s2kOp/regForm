<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: url("./backgroundwithsidesonly.jpg") no-repeat center center fixed;
    background-size: cover;
    padding: 20px;
}

.wrapper {
    width: 100%;
    max-width: 620px;
    display: flex;
    flex-direction: column;
    border: 2px solid white;
    padding: 45px 35px;
    border-radius: 12px;
    backdrop-filter: blur(5px);
    background-color: rgba(255, 255, 255, 0.05);
    color: white;
}

input,
select {
    width: 100%;
    height: 44px;
    margin-bottom: 15px;
    border: 1px solid white;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.15);
    padding-left: 15px;
    font-size: 18px;
    color: white;
}

input::placeholder {
    color: #ddd;
}

select {
    color: white;
}

button {
    width: 100%;
    height: 45px;
    font-size: 20px;
    border-radius: 12px;
    border: 1px solid white;
    background: rgba(255, 255, 255, 0.15);
    cursor: pointer;
    color: white;
}

button:hover {
    background-color: rgba(255, 255, 255, 0.25);
}

    </style>
</head>
<body>
        <form id="registerForm" method="post" class="wrapper" >
            <h1>Registration Form</h1>
            <hr>

            <label>First Name :</label>
            <input type="text" class="myInp" placeholder="First Name" required>
            <label>Last Name :</label>
            <input type="text" class="myInp" placeholder="Last Name" required>
            <label>Email :</label>
            <input type="email" class="myInp" placeholder="abc@gmail.com" required>
            <label>Password :</label>
            <input type="password" class="myInp" placeholder="Password" required>
            <label>Confirm Password :</label>
            <input type="password" class="myInp"  placeholder="Confirm Password" required>
            <label>Date Of Birth :</label>
            <input type="date" class="myInp" placeholder="DD-MM-YYY" required>
            <label>Gender :</label>
            <select required>
                <option disabled>Select an option</option>
                <option>Male</option>
                <option>Female</option>
                <option>Others</option>
            </select>
            <div class="myBtn">
                <button type = "submit">Register</button>
            </div>
        </form>
</body>
<script>
    const inputs = document.getElementsByClassName("myInp");
    const regForm = document.getElementById("registerForm");
    regForm.addEventListener("submit", function handleSubmit(e){
        e.preventDefault();
    
        let allFilled = true;
        for(let i = 0; i < inputs.length; i++){
            if(inputs[i].value.trim() === ""){
                allFilled = false;
                break;
            }
        }
    
        if(!allFilled){
            alert("Please fill out all fields.");
            return;
        }
    
        const password = inputs[3].value.trim();
        const confirmPassword = inputs[4].value.trim();
    
        if(password !== confirmPassword){
            alert("Passwords do not match.");
            return;
        }
    
        alert("Form submitted successfully!");
        }
    )

</script>
</html>
