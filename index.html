<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            background: url("./backgroundwithsidesonly.jpg") no-repeat;
            background-size: cover;
        }
        .wrapper{
            display: flex;
            border: 2px solid;
            flex-direction: column;
            padding: 45px 35px;
            width: 620px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }
        h1{
            font-size: 3em;
            margin-bottom: 22px;
            text-align: center;
            color: white;
        }
        hr{
            margin-bottom: 10px;
        }
        label{
            font-size: 20px;
            margin-top: 5px;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input{
            margin-bottom: 10px;
            height: 44px;
            border: 1px solid rgb(18, 60, 26);
            border-radius: 15px;
            background: transparent;
            padding-left: 15px; 
            font-size: 18px;
        }
        input::placeholder{
            color: black;
        }
        select{
            height: 44px; 
            padding-left: 15px; 
            font-size: 18px; 
            border: 1px solid white; 
            background-color: rgba(229, 231, 236, 0.817); 
            margin-bottom: 18px;
            background: transparent;
        }
        button{
            width: 100%;
            height: 45px;
            font-size: 22px; 
            border-radius: 15px;
            padding: 10px;
            border: 1px solid rgb(14, 93, 38);
            background: transparent;
            cursor: pointer;
        }
        button:hover{
            background-color: rgba(255, 255, 255, 0.306);
        }
    </style>
</head>
<body>
        <form id="registerForm" method="post" class="wrapper" >
            <h1>Registration Form</h1>
            <hr>

            <label>First Name :</label>
            <input type="text" class="myInp" placeholder="First Name" required>
            <label>Last Name :</label>
            <input type="text" class="myInp" placeholder="Last Name" required>
            <label>Email :</label>
            <input type="email" class="myInp" placeholder="abc@gmail.com" required>
            <label>Password :</label>
            <input type="password" class="myInp" placeholder="Password" required>
            <label>Confirm Password :</label>
            <input type="password" class="myInp"  placeholder="Confirm Password" required>
            <label>Date Of Birth :</label>
            <input type="date" class="myInp" placeholder="DD-MM-YYY" required>
            <label>Gender :</label>
            <select required>
                <option disabled>Select an option</option>
                <option>Male</option>
                <option>Female</option>
                <option>Others</option>
            </select>
            <div class="myBtn">
                <button type = "submit">Register</button>
            </div>
        </form>
</body>
<script>
    const inputs = document.getElementsByClassName("myInp");
    const regForm = document.getElementById("registerForm");
    regForm.addEventListener("submit", function handleSubmit(e){
        e.preventDefault();
    
        let allFilled = true;
        for(let i = 0; i < inputs.length; i++){
            if(inputs[i].value.trim() === ""){
                allFilled = false;
                break;
            }
        }
    
        if(!allFilled){
            alert("Please fill out all fields.");
            return;
        }
    
        const password = inputs[3].value.trim();
        const confirmPassword = inputs[4].value.trim();
    
        if(password !== confirmPassword){
            alert("Passwords do not match.");
            return;
        }
    
        alert("Form submitted successfully!");
        }
    )

</script>
</html>
